# 生产配置：安全 Cookie、关闭接口调试页面、不输出详细健康信息。
spring:
  config:
    activate:
      on-profile: prod

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: false

logging:
  level:
    com.kaoyan.study: INFO
  file:
    name: ${LOG_FILE:logs/study-backend.log}
