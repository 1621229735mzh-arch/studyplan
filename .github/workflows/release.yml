name: 生产发布

# 生产发布必须手动触发：先做迁移检查与构建，再部署，最后做健康检查。
# 不在此流程中执行数据库结构变更以外的任何手工改表操作。
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 发布版本标签（默认使用提交短 SHA）
        required: false
        type: string
      skip_tests:
        description: 跳过测试（仅用于紧急回滚验证）
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: 计算版本标签
        id: tag
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 后端打包
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ steps.tag.outputs.value }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 前端安装与构建
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ steps.tag.outputs.value }}

  deploy:
    name: 部署到服务器
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # 服务器地址、账号与密钥以仓库 Secrets 提供，不写入仓库。
      - name: 上传部署文件
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/
          target: /srv/408doing

      - name: 执行部署脚本
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd /srv/408doing/deploy
            ./scripts/deploy.sh "$IMAGE_TAG"
