# 同域名提供前端静态文件，并把 /api 转发到后端容器。
# 数据库与管理端点一律不对外开放。

upstream study_backend {
    server backend:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 前端构建产物所在的根目录
    root /usr/share/nginx/html;
    index index.html;

    # 请求体大小限制：学习记录与备注都是小 JSON
    client_max_body_size 1m;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 导入原始 JSON 以字符串封装，允许转义开销；服务端限制文件为 2 MB。
    location /api/plan/imports/ {
        client_max_body_size 5m;
        proxy_pass http://study_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
    }

    # 接口转发：保留 Cookie 与真实来源信息
    location /api/ {
        proxy_pass http://study_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # 管理端点只允许容器内健康检查使用，不对外暴露
    location /actuator/ {
        deny all;
        return 404;
    }

    # 构建产物带哈希，可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker 与清单不缓存，保证能及时更新
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
