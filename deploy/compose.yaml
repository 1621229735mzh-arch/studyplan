# 单机部署：前端（Nginx）→ 后端 → MySQL。
# 用法见 deploy/README.md；镜像版本通过 .env 固定，不使用浮动 tag。
name: study-workbench

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置}
      MYSQL_DATABASE: ${DB_NAME:-kaoyan_study}
      MYSQL_USER: ${DB_USERNAME:?请在 .env 中设置}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    # 不发布端口：数据库只允许容器网络内访问
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/OWNER/REPO/backend}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-kaoyan_study}
      DB_USERNAME: ${DB_USERNAME:?请在 .env 中设置}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置}
      # 预设账号口令只在首次启动建号时使用
      PRESET_ACCOUNT_USERNAME: ${PRESET_ACCOUNT_USERNAME:-kaoyan}
      PRESET_ACCOUNT_PASSWORD: ${PRESET_ACCOUNT_PASSWORD:?请在 .env 中设置}
      SESSION_COOKIE_SECURE: 'true'
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-7d}
      TZ: Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    networks:
      - internal
    # 不发布端口：只允许 Nginx 容器访问
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/REPO/frontend}:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'
    networks:
      - internal

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
